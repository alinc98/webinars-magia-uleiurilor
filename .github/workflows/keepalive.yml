# Planul gratuit Supabase pune proiectul în pauză după 7 zile fără trafic.
# Nu se întâmplă în timpul unei campanii, ci între ele — exact când nu se uită
# nimeni (PLAN.md §2.2).
name: Keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interogare trivială în bază
        run: |
          cod=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            "${{ secrets.SITE_URL }}/api/health" --max-time 60)
          cat /tmp/health.json
          echo
          [ "$cod" = "200" ] || { echo "::error::/api/health a răspuns $cod"; exit 1; }
