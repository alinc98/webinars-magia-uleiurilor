# Remindere și follow-up-uri, din 15 în 15 minute.
#
# Nu Vercel Cron: planul Hobby permite o singură rulare pe zi, ceea ce face
# reminderele de 24h și 1h imposibile (PLAN.md §2.1).
#
# Cron-ul GitHub poate întârzia 5–20 de minute la ore de vârf. Nu contează:
# endpoint-ul caută tot ce e scadent într-o fereastră, nu la un moment exact,
# iar revendicarea din bază face rulările repetate inofensive.
name: Remindere

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: remindere
  cancel-in-progress: false

jobs:
  trimite:
    runs-on: ubuntu-latest
    steps:
      # Trei încercări, nu una.
      #
      # Supabase respinge din când în când cheia cu „JWT issued at future" —
      # o eroare trecătoare, care nu ţine de datele noastre. Reîncercarea e
      # inofensivă: revendicarea marchează rândurile înainte de trimitere,
      # deci a doua încercare ia doar ce a rămas nerevendicat, niciodată acelaşi
      # destinatar de două ori.
      - name: Declanșează cron-ul
        run: |
          for incercare in 1 2 3; do
            cod=$(curl -sS -o /tmp/raspuns.json -w '%{http_code}' \
              -X POST "${{ secrets.SITE_URL }}/api/cron/reminders" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              --max-time 120)
            cat /tmp/raspuns.json
            echo
            [ "$cod" = "200" ] && exit 0
            echo "::warning::Încercarea $incercare a răspuns $cod"
            sleep $((incercare * 10))
          done
          echo "::error::Cron-ul a răspuns $cod după trei încercări"
          exit 1
