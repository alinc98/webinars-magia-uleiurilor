# Maneta de urgenţă pentru remindere. **Nu mai are program.**
#
# Programarea a trecut pe Vercel Cron, din 5 în 5 minute (vercel.json).
# Motivul dinainte — planul Hobby permitea o singură rulare pe zi — a dispărut
# odată cu trecerea pe Pro, care cheamă în minutul cerut.
#
# `*/15` de aici era oricum o ficţiune: GitHub îl trata ca pe o sugestie şi
# rula o dată la vreo patru ore. Pentru reamintirea de 24 de ore, cu fereastra
# ei largă, mergea. Pentru cea de o oră, nu.
#
# Rămâne declanşabil de mână, pentru zilele în care trebuie forţat ceva acum.
name: Remindere (manual)

on:
  workflow_dispatch:

concurrency:
  group: remindere
  cancel-in-progress: false

jobs:
  trimite:
    runs-on: ubuntu-latest
    steps:
      # Trei încercări, nu una.
      #
      # Supabase respinge din când în când cheia cu „JWT issued at future" —
      # o eroare trecătoare, care nu ţine de datele noastre. Reîncercarea e
      # inofensivă: revendicarea marchează rândurile înainte de trimitere,
      # deci a doua încercare ia doar ce a rămas nerevendicat, niciodată acelaşi
      # destinatar de două ori.
      - name: Declanșează cron-ul
        run: |
          for incercare in 1 2 3; do
            cod=$(curl -sS -o /tmp/raspuns.json -w '%{http_code}' \
              -X POST "${{ secrets.SITE_URL }}/api/cron/reminders" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              --max-time 120)
            cat /tmp/raspuns.json
            echo
            [ "$cod" = "200" ] && exit 0
            echo "::warning::Încercarea $incercare a răspuns $cod"
            sleep $((incercare * 10))
          done
          echo "::error::Cron-ul a răspuns $cod după trei încercări"
          exit 1
